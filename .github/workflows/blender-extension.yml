name: Blender Extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test Blender ${{ matrix.blender-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender-version: "5.0.0"
            blender-series: "5.0"
          - blender-version: "5.1.1"
            blender-series: "5.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: .cache/blender/blender-${{ matrix.blender-version }}-linux-x64
          key: blender-${{ runner.os }}-${{ matrix.blender-version }}-linux-x64

      - name: Download Blender
        env:
          BLENDER_VERSION: ${{ matrix.blender-version }}
          BLENDER_SERIES: ${{ matrix.blender-series }}
        run: |
          set -euo pipefail
          archive="blender-${BLENDER_VERSION}-linux-x64"
          blender_dir="${GITHUB_WORKSPACE}/.cache/blender/${archive}"

          if [ ! -x "${blender_dir}/blender" ]; then
            mkdir -p "${GITHUB_WORKSPACE}/.cache/blender"
            curl --fail --location --retry 3 \
              "https://download.blender.org/release/Blender${BLENDER_SERIES}/${archive}.tar.xz" \
              --output "${RUNNER_TEMP}/${archive}.tar.xz"
            tar -xf "${RUNNER_TEMP}/${archive}.tar.xz" -C "${GITHUB_WORKSPACE}/.cache/blender"
          fi

          echo "BLENDER_BIN=${blender_dir}/blender" >> "${GITHUB_ENV}"

      - name: Check Python syntax
        run: |
          python -m compileall \
            __init__.py \
            __make_addon_zip.py \
            preferences \
            ops \
            addon \
            imexporter \
            translation \
            ui \
            tests \
            clipboard \
            public_path_utils.py

      - name: Validate extension source
        run: |
          "${BLENDER_BIN}" --factory-startup --command extension validate "${GITHUB_WORKSPACE}"

      - name: Run Blender smoke test
        run: |
          "${BLENDER_BIN}" --factory-startup --background \
            --python "${GITHUB_WORKSPACE}/tests/blender/background_smoke.py" \
            -- \
            --workspace "${GITHUB_WORKSPACE}" \
            --runtime-dir "${RUNNER_TEMP}/super_io-blender-background" \
            --config-dir "${RUNNER_TEMP}/super_io-blender-background/super_io_config"

  package:
    name: Package Extension
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: .cache/blender/blender-5.0.0-linux-x64
          key: blender-${{ runner.os }}-5.0.0-linux-x64

      - name: Download Blender
        env:
          BLENDER_VERSION: "5.0.0"
          BLENDER_SERIES: "5.0"
        run: |
          set -euo pipefail
          archive="blender-${BLENDER_VERSION}-linux-x64"
          blender_dir="${GITHUB_WORKSPACE}/.cache/blender/${archive}"

          if [ ! -x "${blender_dir}/blender" ]; then
            mkdir -p "${GITHUB_WORKSPACE}/.cache/blender"
            curl --fail --location --retry 3 \
              "https://download.blender.org/release/Blender${BLENDER_SERIES}/${archive}.tar.xz" \
              --output "${RUNNER_TEMP}/${archive}.tar.xz"
            tar -xf "${RUNNER_TEMP}/${archive}.tar.xz" -C "${GITHUB_WORKSPACE}/.cache/blender"
          fi

          echo "BLENDER_BIN=${blender_dir}/blender" >> "${GITHUB_ENV}"

      - name: Build extension package
        env:
          PACKAGE_DIR: ${{ runner.temp }}/super_io-dist
        run: |
          set -euo pipefail
          mkdir -p "${PACKAGE_DIR}"
          "${BLENDER_BIN}" --factory-startup --command extension build \
            --source-dir "${GITHUB_WORKSPACE}" \
            --output-dir "${PACKAGE_DIR}"

          shopt -s nullglob
          packages=("${PACKAGE_DIR}"/super_io-*.zip)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one extension zip, found ${#packages[@]}"
            exit 1
          fi

          echo "PACKAGE_PATH=${packages[0]}" >> "${GITHUB_ENV}"

      - name: Validate extension package
        run: |
          "${BLENDER_BIN}" --factory-startup --command extension validate "${PACKAGE_PATH}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: super_io-extension
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

      - name: Generate release notes
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          release_commit="$(git rev-list -n 1 "${release_tag}")"
          previous_tag="$(git describe --tags --abbrev=0 "${release_commit}^" 2> /dev/null || true)"

          if [ -n "${previous_tag}" ]; then
            commit_range="${previous_tag}..${release_tag}"
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_tag}...${release_tag}"
          else
            commit_range="${release_tag}"
            compare_url=""
          fi

          notes_file="${RUNNER_TEMP}/RELEASE_NOTES.md"
          breaking_file="${RUNNER_TEMP}/release-breaking.md"
          feat_file="${RUNNER_TEMP}/release-feat.md"
          fix_file="${RUNNER_TEMP}/release-fix.md"
          change_file="${RUNNER_TEMP}/release-change.md"

          : > "${breaking_file}"
          : > "${feat_file}"
          : > "${fix_file}"
          : > "${change_file}"

          field_separator=$'\x1f'
          record_separator=$'\x1e'

          while IFS= read -r -d "${record_separator}" record || [ -n "${record}" ]; do
            record="${record#$'\n'}"
            hash="${record%%${field_separator}*}"
            rest="${record#*${field_separator}}"
            subject="${rest%%${field_separator}*}"
            body="${rest#*${field_separator}}"

            [ -n "${hash}" ] || continue
            entry="- ${subject} (${hash})"

            if [[ "${subject}" =~ ^[a-zA-Z0-9_-]+(\(.+\))?!: ]] || grep -qi '^BREAKING CHANGE:' <<< "${body}"; then
              echo "${entry}" >> "${breaking_file}"
            elif [[ "${subject}" == feat:* || "${subject}" == feat\(* ]]; then
              echo "${entry}" >> "${feat_file}"
            elif [[ "${subject}" == fix:* || "${subject}" == fix\(* ]]; then
              echo "${entry}" >> "${fix_file}"
            else
              echo "${entry}" >> "${change_file}"
            fi
          done < <(git log --no-merges --format='%h%x1f%s%x1f%b%x1e' "${commit_range}")

          {
            echo "## ${release_tag}"
            echo
            if [ -n "${compare_url}" ]; then
              echo "[Compare changes](${compare_url})"
              echo
            fi

            echo "### Breaking Changes"
            if [ -s "${breaking_file}" ]; then cat "${breaking_file}"; else echo "- None"; fi
            echo

            echo "### Features"
            if [ -s "${feat_file}" ]; then cat "${feat_file}"; else echo "- None"; fi
            echo

            echo "### Fixes"
            if [ -s "${fix_file}" ]; then cat "${fix_file}"; else echo "- None"; fi
            echo

            echo "### Changes"
            if [ -s "${change_file}" ]; then cat "${change_file}"; else echo "- None"; fi
          } > "${notes_file}"

          echo "RELEASE_NOTES=${notes_file}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"

          if gh release view "${release_tag}" > /dev/null 2>&1; then
            gh release edit "${release_tag}" --notes-file "${RELEASE_NOTES}"
            gh release upload "${release_tag}" "${PACKAGE_PATH}" --clobber
          else
            gh release create "${release_tag}" "${PACKAGE_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "${release_tag}" \
              --notes-file "${RELEASE_NOTES}"
          fi
