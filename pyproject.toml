[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "build",
    "dist",
    "docs/node_modules",
    "docs/.vitepress",
    "third_party_addons",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",
]
